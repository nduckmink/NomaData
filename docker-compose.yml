name: nomadata

# All credentials and host ports are configurable via environment variables
# (read from the root .env file). Defaults keep a zero-config dev experience —
# `pnpm infra` / `pnpm up` work out of the box. Override in .env for anything
# real. Container-internal ports (5432, 4000, 8000, 3000) are fixed; only the
# *published* host ports are parameterized.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nomadata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nomadata}
      POSTGRES_DB: ${POSTGRES_DB:-nomadata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nomadata}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # In the "full" profile only — for local dev, run the API with `pnpm api:dev`
    # (hot reload) against infra started by `pnpm infra`.
    profiles: ["full"]
    build:
      context: ./apps/api
    environment:
      NOMADATA_ENV: ${NOMADATA_ENV:-development}
      NOMADATA_DATABASE_URL: postgresql://${POSTGRES_USER:-nomadata}:${POSTGRES_PASSWORD:-nomadata}@postgres:5432/${POSTGRES_DB:-nomadata}
      NOMADATA_CUBE_URL: http://cube:4000
      NOMADATA_CUBE_API_SECRET: ${CUBE_API_SECRET:-dev-secret-change-me}
      # Publish writes generated Cube models here; the cube service reads them.
      NOMADATA_CUBE_MODEL_DIR: /cube/model
      NOMADATA_CORS_ORIGINS: ${NOMADATA_CORS_ORIGINS:-http://localhost:3000}
      # AI provider — forwarded from .env so secrets never live in this file.
      NOMADATA_AI_PROVIDER: ${NOMADATA_AI_PROVIDER:-openai_compatible}
      NOMADATA_AI_BASE_URL: ${NOMADATA_AI_BASE_URL:-https://api.openai.com/v1}
      NOMADATA_AI_API_KEY: ${NOMADATA_AI_API_KEY:-}
      NOMADATA_AI_MODEL: ${NOMADATA_AI_MODEL:-gpt-4o-mini}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Share the Cube model dir so `publish` can write cubes the cube service reads.
      - ./cube:/cube
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/api/nomadata
          target: /app/nomadata

  web:
    # In the "full" profile only — for local dev, run the client with
    # `pnpm web:dev` (HMR) against infra + a locally-run API.
    profiles: ["full"]
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  cube:
    image: cubejs/cube:latest
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:-dev-secret-change-me}
      # No pre-aggregations yet — stop the refresh scheduler from hammering
      # driverFactory with the "default" data source.
      CUBEJS_SCHEDULED_REFRESH_TIMER: "false"
      # Cube reads each data source's connection from the app DB at query time
      # (cube/cube.js driverFactory) — the UI is the single source of truth, so
      # there is no static CUBEJS_DB_* here. This URL points Cube at the app
      # Postgres so it can read the `data_sources` table.
      CUBEJS_APP_DB_URL: postgresql://${POSTGRES_USER:-nomadata}:${POSTGRES_PASSWORD:-nomadata}@postgres:5432/${POSTGRES_DB:-nomadata}
    ports:
      - "${CUBE_PORT:-4000}:4000"
    volumes:
      - ./cube:/cube/conf
    extra_hosts:
      # So Cube can reach a data source the app configured as localhost/127.0.0.1.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
